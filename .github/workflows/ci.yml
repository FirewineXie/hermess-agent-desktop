name: PR checks

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: pr-checks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ci:
    name: Build and test (Windows)
    runs-on: windows-2025
    timeout-minutes: 45
    concurrency:
      group: ${{ github.event_name == 'pull_request' && 'all-pr-windows-ci' || format('main-windows-ci-{0}', github.ref) }}
      queue: max
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.25.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-deps-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('apps/desktop/src-tauri/Cargo.lock', 'rust-toolchain.toml') }}
      - name: Verify locked upstream source
        run: node scripts/fetch-upstream.mjs
      - name: Check bundled upstream license
        run: pnpm check:legal
      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile
      - name: Check architecture boundaries
        run: pnpm check:architecture
      - name: Check shared contract schemas
        run: pnpm check:contracts
      - name: Check generated contract types
        run: pnpm check:generated-contracts
      - name: Check update channel rules
        run: pnpm test:update-rules
      - name: Build frontend preview
        run: pnpm --dir apps/frontend build
      - name: Build frontend
        run: pnpm build
      - name: Install Rust formatter
        run: rustup component add rustfmt
      - name: Check Rust formatting
        run: cargo fmt --manifest-path apps/desktop/src-tauri/Cargo.toml --all -- --check
      - name: Check Rust compilation
        run: cargo check --manifest-path apps/desktop/src-tauri/Cargo.toml --locked
      - name: Run Rust tests
        run: cargo test --manifest-path apps/desktop/src-tauri/Cargo.toml --locked
