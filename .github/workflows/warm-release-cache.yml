name: Warm native release dependencies

on:
  push:
    branches: [main]
    paths:
      - runtime/upstream.lock.json
      - scripts/build-core-payload.py
      - pnpm-lock.yaml
      - apps/desktop/src-tauri/Cargo.lock
      - rust-toolchain.toml
      - .github/workflows/warm-release-cache.yml
  workflow_dispatch:
    inputs:
      source_ref:
        description: Committed ref to prewarm (use the exact RC commit before tagging)
        required: false
        default: main
        type: string
      target:
        description: Native target to prewarm on main before pushing a release tag
        required: true
        type: choice
        options:
          - win32-x64
          - darwin-arm64
          - darwin-x64
          - linux-x64

permissions:
  contents: read

jobs:
  targets:
    runs-on: ubuntu-22.04
    outputs:
      include: ${{ steps.select.outputs.include }}
    steps:
      - id: select
        env:
          TARGET: ${{ inputs.target }}
        shell: bash
        run: |
          if [[ "$GITHUB_EVENT_NAME" == push ]]; then
            echo 'include=[{"target":"win32-x64","runner":"windows-2025"},{"target":"darwin-arm64","runner":"macos-15"}]' >> "$GITHUB_OUTPUT"
          else
            case "$TARGET" in
              win32-x64) runner=windows-2025 ;;
              darwin-arm64) runner=macos-15 ;;
              darwin-x64) runner=macos-15-intel ;;
              linux-x64) runner=ubuntu-22.04 ;;
              *) exit 1 ;;
            esac
            echo "include=[{\"target\":\"$TARGET\",\"runner\":\"$runner\"}]" >> "$GITHUB_OUTPUT"
          fi

  warm:
    needs: targets
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.targets.outputs.include) }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref || github.ref }}
      - uses: pnpm/action-setup@v4
        with:
          version: 10.25.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'
      - uses: actions/cache@v4
        with:
          path: .cache/pnpm-store
          key: pnpm-deps-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('pnpm-lock.yaml') }}
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-deps-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('apps/desktop/src-tauri/Cargo.lock', 'rust-toolchain.toml') }}
      - name: Preload Node and Cargo dependencies
        run: |
          pnpm install --frozen-lockfile --store-dir .cache/pnpm-store
          cargo fetch --locked --manifest-path apps/desktop/src-tauri/Cargo.toml
      - id: native-cache
        uses: actions/cache@v4
        with:
          path: .cache/ci-release
          key: native-deps-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('runtime/upstream.lock.json', 'scripts/build-core-payload.py') }}
      - name: Prebuild verified Python and uv dependency cache
        if: steps.native-cache.outputs.cache-hit != 'true'
        run: |
          node scripts/fetch-upstream.mjs
          python scripts/build-core-payload.py --out .build/payload --cache-root .cache/ci-release
