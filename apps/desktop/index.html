<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Hermess Agent Desktop</title>
    <style>
      body { margin: 0; }

      .desktop-boot {
        min-height: 100vh;
        display: grid;
        place-content: center;
        gap: 12px;
        background: #f7f9fc;
        color: #25324a;
        font: 14px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif;
        text-align: center;
      }

      .desktop-boot-mark {
        width: 40px;
        height: 40px;
        margin: 0 auto;
        display: grid;
        place-items: center;
        border-radius: 12px;
        background: #e7eeff;
        color: #3867d6;
        font-size: 22px;
        font-weight: 700;
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="desktop-boot" role="status" aria-live="polite">
        <div class="desktop-boot-mark" aria-hidden="true">H</div>
        <div>正在启动 Hermess Agent Desktop…</div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
