[package]
name = "hermess-agent-desktop"
version = "0.0.0"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "unstable", "devtools"] }
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
tokio = { version = "1", features = ["process", "time", "macros", "sync", "rt", "io-util", "fs", "net"] }
tokio-tungstenite = "0.29"
hyper = { version = "1", features = ["client", "server", "http1"] }
hyper-util = { version = "0.1", features = ["client-legacy", "http1", "tokio"] }
http-body-util = "0.1"
tokio-rustls = "0.26"
rcgen = { version = "0.14", default-features = false, features = ["aws_lc_rs", "pem"] }
futures-util = "0.3"
serde_json = "1"
serde_yaml = "0.9"
uuid = { version = "1", features = ["v4"] }
sha2 = "0.10"
tar = "0.4"
flate2 = "1"
toml = "1.1"
toml_edit = "0.25"
reqwest = { version = "0.13", default-features = false, features = ["json", "form", "multipart", "rustls"] }
tauri-plugin-dialog = "2"
chrono = "0.4"
zip = { version = "9.0", default-features = false, features = ["deflate"] }
base64 = "0.22"
aes-gcm = "0.10"
portable-pty = "0.9"
tauri-plugin-opener = "2"
tauri-plugin-notification = "2"
tauri-plugin-global-shortcut = "2"
keyring = { version = "3.6.3", default-features = false, features = ["windows-native", "apple-native"] }
tempfile = "3.27"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_Storage_FileSystem", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_System_Power", "Win32_System_Pipes", "Win32_System_Diagnostics_ToolHelp", "Win32_UI_WindowsAndMessaging"] }
windows = "0.62.2"
windows-registry = "0.6.0"
webview2-com = "0.39.1"
tauri-winrt-notification = "0.8.1"

[target.'cfg(target_os = "macos")'.dependencies]
libc = "0.2"
block2 = "0.6.2"
objc2-foundation = "0.3.2"
objc2-web-kit = { version = "0.3.2", features = ["WKWebView", "WKWebViewConfiguration", "WKWebsiteDataRecord", "WKWebsiteDataStore", "block2"] }

[target.'cfg(all(unix, not(target_os = "macos")))'.dependencies]
libc = "0.2"

[profile.release]
strip = "symbols"
