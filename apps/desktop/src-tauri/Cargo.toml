[package]
name = "hermess-agent-desktop"
version = "0.1.0"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
tokio = { version = "1", features = ["process", "time"] }
tokio-tungstenite = "0.29"
futures-util = "0.3"
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
