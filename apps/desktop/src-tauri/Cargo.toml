[package]
name = "hermess-agent-desktop"
version = "0.0.0"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "unstable", "devtools"] }
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
tokio = { version = "1", features = ["process", "time", "macros", "sync", "rt", "io-util", "fs", "net"] }
tokio-tungstenite = "0.29"
futures-util = "0.3"
serde_json = "1"
serde_yaml = "0.9"
uuid = { version = "1", features = ["v4"] }
sha2 = "0.10"
tar = "0.4"
reqwest = { version = "0.13", default-features = false, features = ["json", "form", "rustls"] }
tauri-plugin-dialog = "2"
chrono = "0.4"
zip = { version = "9.0", default-features = false, features = ["deflate"] }
base64 = "0.22"
portable-pty = "0.9"
tauri-plugin-opener = "2"
tauri-plugin-notification = "2"
tauri-plugin-global-shortcut = "2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Security", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_System_Power", "Win32_System_Pipes", "Win32_System_Diagnostics_ToolHelp"] }
windows = "0.62.2"
windows-registry = "0.6.0"
webview2-com = "0.39.1"
tauri-winrt-notification = "0.8.1"

[target.'cfg(target_os = "macos")'.dependencies]
libc = "0.2"
block2 = "0.6.2"
objc2-foundation = "0.3.2"
objc2-web-kit = { version = "0.3.2", features = ["WKWebView", "WKWebViewConfiguration", "WKWebsiteDataRecord", "WKWebsiteDataStore", "block2"] }

[target.'cfg(all(unix, not(target_os = "macos")))'.dependencies]
libc = "0.2"

[profile.release]
strip = "symbols"
