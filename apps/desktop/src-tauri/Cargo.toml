[package]
name = "hermess-agent-desktop"
version = "0.1.5-rc.2"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "unstable"] }
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
tokio = { version = "1", features = ["process", "time", "macros", "sync", "rt", "io-util", "fs"] }
tokio-tungstenite = "0.29"
futures-util = "0.3"
serde_json = "1"
serde_yaml = "0.9"
uuid = { version = "1", features = ["v4"] }
sha2 = "0.10"
tar = "0.4"
reqwest = { version = "0.13", default-features = false, features = ["json", "form", "rustls"] }
tauri-plugin-dialog = "2"
chrono = "0.4"
zip = { version = "2.4", default-features = false, features = ["deflate"] }
base64 = "0.22"
portable-pty = "0.9"

[profile.release]
strip = "symbols"
